name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: everything-is-points-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # Mac universal build only runs on tag pushes (and manual dispatch).
  # ~15-20 minutes — too slow to spend on every main push, but a release
  # absolutely needs it. Tagging v* triggers it; the release job below
  # then attaches its DMG to the GitHub Release alongside the Windows
  # installers.
  build-mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - run: npm run tauri build -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: everything-is-points-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # On v* tag pushes, gather the artifacts from both build jobs and
  # publish a GitHub Release with auto-generated notes from the commit
  # log since the previous tag.
  release:
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/everything-is-points-windows/msi/*.msi
            artifacts/everything-is-points-windows/nsis/*.exe
            artifacts/everything-is-points-mac/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
